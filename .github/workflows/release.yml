name: release-skill

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - prompt-engineer/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=prompt-engineer-skill-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "stable_asset=prompt-engineer-skill.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$ASSETS" | grep -Fxq "$ASSET"; then
              echo "asset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "asset_exists=false" >> "$GITHUB_OUTPUT"
            fi
            if printf '%s\n' "$ASSETS" | grep -Fxq "$STABLE_ASSET"; then
              echo "stable_asset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable_asset_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "asset_exists=false" >> "$GITHUB_OUTPUT"
            echo "stable_asset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run contract tests
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        run: python -m unittest discover -s tests -v

      - name: Verify canonical seven-file package
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("prompt-engineer")
          expected = {
              "SKILL.md",
              "references/software-engineering.md",
              "references/project-context.md",
              "adapters/opencode.md",
              "adapters/codex.md",
              "adapters/claude-code.md",
              "examples/examples.md",
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f"Canonical package mismatch. Missing={missing}; Extra={extra}")
          print("Canonical package verified: exactly 7 files.")
          PY

      - name: Build installable ZIPs
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          archive = f"prompt-engineer-skill-v{version}"
          versioned = Path(shutil.make_archive(archive, "zip", root_dir=".", base_dir="prompt-engineer"))
          stable = Path("prompt-engineer-skill.zip")
          shutil.copyfile(versioned, stable)
          print(f"Created {versioned.name} and {stable.name}")
          PY

      - name: Prepare release notes
        if: steps.release.outputs.release_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} -"
          start = text.find(marker)
          if start == -1:
              raise SystemExit(f"No CHANGELOG section found for {version}")
          next_section = text.find("\n## ", start + len(marker))
          section = text[start: next_section if next_section != -1 else len(text)].strip()
          Path("release-notes.md").write_text(section + "\n", encoding="utf-8")
          print(section)
          PY

      - name: Create GitHub release
        if: steps.release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          gh release create "$TAG" \
            "$ASSET#Installable Prompt Engineer skill (versioned)" \
            "$STABLE_ASSET#Installable Prompt Engineer skill (latest alias)" \
            --target "$GITHUB_SHA" \
            --title "Prompt Engineer $TAG" \
            --notes-file release-notes.md

      - name: Repair missing release assets
        if: steps.release.outputs.release_exists == 'true' && (steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.asset }}#Installable Prompt Engineer skill (versioned)" \
            "${{ steps.version.outputs.stable_asset }}#Installable Prompt Engineer skill (latest alias)" \
            --clobber

      - name: Verify published release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fxq "$ASSET"
          printf '%s\n' "$ASSETS" | grep -Fxq "$STABLE_ASSET"

      - name: Record verified release manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          mkdir -p .github/release-manifests
          cat > ".github/release-manifests/${TAG}.json" <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "asset": "${ASSET}",
            "stable_asset": "${STABLE_ASSET}",
            "verified_from_commit": "${GITHUB_SHA}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/release-manifests/${TAG}.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record verified ${TAG} release assets"
            git push origin HEAD:main
          fi
