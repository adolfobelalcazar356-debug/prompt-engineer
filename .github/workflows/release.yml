name: release-skill

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - prompt-engineer/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=prompt-engineer-skill-v${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "stable_asset=prompt-engineer-skill.zip" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"VERSION must be SemVer X.Y.Z; got {version!r}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## {version} -" not in changelog:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(f"Version metadata valid for {version}.")
          PY

      - name: Guard released version against drift
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            if ! git diff --quiet "$TAG" -- prompt-engineer; then
              echo "::error::The canonical skill changed after ${TAG} was created. Bump VERSION and CHANGELOG before releasing new skill content."
              git diff --name-only "$TAG" -- prompt-engineer
              exit 1
            fi
            echo "Canonical skill matches existing ${TAG}."
          else
            echo "${TAG} does not exist yet; release may proceed."
          fi

      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$ASSETS" | grep -Fxq "$ASSET"; then
              echo "asset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "asset_exists=false" >> "$GITHUB_OUTPUT"
            fi
            if printf '%s\n' "$ASSETS" | grep -Fxq "$STABLE_ASSET"; then
              echo "stable_asset_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable_asset_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "asset_exists=false" >> "$GITHUB_OUTPUT"
            echo "stable_asset_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run contract tests
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        run: python -m unittest discover -s tests -v

      - name: Verify canonical seven-file package
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("prompt-engineer")
          expected = {
              "SKILL.md",
              "references/software-engineering.md",
              "references/project-context.md",
              "adapters/opencode.md",
              "adapters/codex.md",
              "adapters/claude-code.md",
              "examples/examples.md",
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f"Canonical package mismatch. Missing={missing}; Extra={extra}")
          print("Canonical package verified: exactly 7 files.")
          PY

      - name: Build and verify downloadable ZIPs
        if: steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from zipfile import ZIP_DEFLATED, ZipFile

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          versioned = Path(f"prompt-engineer-skill-v{version}.zip")
          stable = Path("prompt-engineer-skill.zip")

          with ZipFile(versioned, "w", compression=ZIP_DEFLATED) as zf:
              for path in sorted(Path("prompt-engineer").rglob("*")):
                  if path.is_file():
                      zf.write(path, path.as_posix())
              zf.write("LICENSE", "LICENSE")

          shutil.copyfile(versioned, stable)

          expected_skill_files = {
              "SKILL.md",
              "references/software-engineering.md",
              "references/project-context.md",
              "adapters/opencode.md",
              "adapters/codex.md",
              "adapters/claude-code.md",
              "examples/examples.md",
          }
          expected_zip_files = {"LICENSE"} | {
              f"prompt-engineer/{name}" for name in expected_skill_files
          }

          for archive in (versioned, stable):
              with ZipFile(archive) as zf:
                  actual = {name.rstrip("/") for name in zf.namelist() if not name.endswith("/")}
              if actual != expected_zip_files:
                  raise SystemExit(
                      f"Unexpected contents in {archive}: "
                      f"missing={sorted(expected_zip_files - actual)} "
                      f"extra={sorted(actual - expected_zip_files)}"
                  )
              print(f"Verified {archive}: 7 skill files + LICENSE.")
          PY

      - name: Prepare release notes
        if: steps.release.outputs.release_exists == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} -"
          start = text.find(marker)
          if start == -1:
              raise SystemExit(f"No CHANGELOG section found for {version}")
          next_section = text.find("\n## ", start + len(marker))
          section = text[start: next_section if next_section != -1 else len(text)].strip()
          Path("release-notes.md").write_text(section + "\n", encoding="utf-8")
          print(section)
          PY

      - name: Create GitHub release
        if: steps.release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          gh release create "$TAG" \
            "$ASSET#Prompt Engineer skill + MIT license (versioned)" \
            "$STABLE_ASSET#Prompt Engineer skill + MIT license (latest alias)" \
            --target "$GITHUB_SHA" \
            --title "Prompt Engineer $TAG" \
            --notes-file release-notes.md

      - name: Repair missing release assets
        if: steps.release.outputs.release_exists == 'true' && (steps.release.outputs.asset_exists == 'false' || steps.release.outputs.stable_asset_exists == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ steps.release.outputs.asset_exists }}" = "false" ]; then
            gh release upload "$TAG" \
              "${{ steps.version.outputs.asset }}#Prompt Engineer skill + MIT license (versioned)"
          fi
          if [ "${{ steps.release.outputs.stable_asset_exists }}" = "false" ]; then
            gh release upload "$TAG" \
              "${{ steps.version.outputs.stable_asset }}#Prompt Engineer skill + MIT license (latest alias)"
          fi

      - name: Verify published release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fxq "$ASSET"
          printf '%s\n' "$ASSETS" | grep -Fxq "$STABLE_ASSET"

      - name: Record verified release manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.version.outputs.asset }}"
          STABLE_ASSET="${{ steps.version.outputs.stable_asset }}"
          mkdir -p .github/release-manifests
          cat > ".github/release-manifests/${TAG}.json" <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "asset": "${ASSET}",
            "stable_asset": "${STABLE_ASSET}",
            "verified_from_commit": "${GITHUB_SHA}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/release-manifests/${TAG}.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record verified ${TAG} release assets"
            git push origin HEAD:main
          fi
